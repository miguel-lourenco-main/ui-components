# Submodule `infra` is not part of the parent tree; `include:local` cannot see those paths on GitLab.
# Pin `ref` to match: `git ls-tree HEAD infra` (update both when bumping the submodule).
include:
  - project: public-work4/infra
    ref: 0c0af8c8c320c18648858c6d9eb4863c97d3bf7d
    file:
      - ci/templates/base.gitlab-ci.yml
      - ci/templates/jobs-quality.gitlab-ci.yml
      - ci/templates/deploy-gitlab-pages.gitlab-ci.yml

variables:
  ENABLE_VERCEL_DEPLOY: "0"
  ENABLE_COMMENT_MIRROR: "0"
  ENABLE_CI_FIX: "0"

# Local jobs on top of the shared templates (MCP feature):
# registry contract validation and unit tests. Node 20+ required by vitest.
validate_registry:
  stage: test
  extends: .node22_pnpm
  script:
    - ci_banner "🧾 Registry Validation" "pnpm run validate:registry"
    - pnpm run validate:registry
    - ci_ok "Registry contract valid"

unit_test:
  stage: test
  extends: .node22_pnpm
  script:
    - ci_banner "🧪 Unit Tests" "pnpm run test:unit (vitest)"
    - pnpm run test:unit
    - ci_ok "Unit tests passed"

# Playwright e2e + visual snapshots. Main pipeline only (not MR pipelines).
# The image tag must equal the locked @playwright/test version (pnpm-lock.yaml):
# the committed *-chromium-linux.png snapshots are rendered by that browser build.
# Bump both together. CI=true makes playwright.config.ts serve the static export in out/.
e2e_test:
  stage: test
  extends: .node22_pnpm
  image: mcr.microsoft.com/playwright:v1.54.2-jammy
  needs:
    - job: build_job
      artifacts: true
  variables:
    CI: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - !reference [.ci_log_load, script]
    - ci_banner "🎭 E2E Tests" "pnpm test:e2e (Playwright, serves out/)"
    - pnpm test:e2e
    - ci_ok "E2E tests passed"
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

# Keep GitLab Pages independent of e2e: the `test` stage now contains e2e_test, and a
# stage-ordered job would wait for it. Explicit needs lists everything pages gated on
# before (lint, typecheck, build, registry, unit) except e2e_test.
pages:
  needs:
    - lint_job
    - typecheck_job
    - job: build_job
      artifacts: true
    - validate_registry
    - unit_test
